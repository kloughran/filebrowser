services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "1501:1501"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 200
    networks:
      - backend
    volumes:
      - /media/books:/srv
      - /media/container-storage/filebrowser/filebrowser:/database
      - /media/container-storage/filebrowser/filebrowser:/config

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    user: "1502:1502"
    cap_drop:
      - ALL
    # the image's caddy binary carries file cap net_bind_service; exec fails with EPERM without it
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 200
    networks:
      - frontend
      - backend
    ports:
      - "9443:443"
    volumes:
      - /media/container-storage/filebrowser/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /media/container-storage/filebrowser/caddy/data:/data
      - /media/container-storage/filebrowser/caddy/config:/config

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.1.0/24
